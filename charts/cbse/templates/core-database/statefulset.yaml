# One-replica PostgreSQL Core DB StatefulSet. Stable selector and
# serviceName, digest-pinned image via cbse.image. The chart-generated
# core-db-credentials Secret supplies POSTGRES_USER and POSTGRES_PASSWORD
# by exact key; the database name and PGDATA are non-secret
# configuration. PGDATA lives inside the mounted data volume for PVC
# compatibility. The official PostgreSQL entrypoint keeps the minimum
# startup permissions it requires (it owns and initializes the data
# directory before dropping to the postgres user), so the restricted
# application-container security profile is deliberately not forced onto
# this container; the Pod-level RuntimeDefault seccomp profile applies and
# no privileged or host settings are set. The image is an official
# external image: the Pod carries no pull Secret, matching the Secret
# inventory (the fixed cbse-registry-auth is referenced by the
# installation-owner Service Accounts only). Persistent mode (default)
# mounts the retained `data` claim template; the explicit development
# branch (persistence.enabled=false) swaps in an emptyDir at the same
# mount path and renders no claim template.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cbse.name.coreDatabaseService" . }}
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cbse.name.coreDatabaseService" . }}
  serviceName: {{ include "cbse.name.coreDatabaseService" . }}-headless
  {{- if .Values.coreDatabase.persistence.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ if .Values.coreDatabase.persistence.retain }}Retain{{ else }}Delete{{ end }}
    whenScaled: {{ if .Values.coreDatabase.persistence.retain }}Retain{{ else }}Delete{{ end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.coreDatabase.persistence.size }}
        {{- if .Values.coreDatabase.persistence.storageClass }}
        storageClassName: {{ .Values.coreDatabase.persistence.storageClass }}
        {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ include "cbse.name.coreDatabaseService" . }}
        {{- include "cbse.labels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ include "cbse.image" .Values.coreDatabase.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.coreDatabase.database }}"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "cbse.name.coreDatabaseCredentials" . }}
                  key: SCENARIO_MANAGER_CORE_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cbse.name.coreDatabaseCredentials" . }}
                  key: SCENARIO_MANAGER_CORE_DB_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.coreDatabase.resources | nindent 12 }}
      {{- if not .Values.coreDatabase.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
