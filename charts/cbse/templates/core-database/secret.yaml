# Helm-managed fixed-name Core DB credentials Secret (D7 ruling; Helm owns
# this Secret exclusively). First install against a cluster with no Secret
# generates the username cbse and a 48-character random alphanumeric
# password; every later upgrade reuses both existing encoded values
# byte-for-byte through lookup. An existing Secret missing either exact
# key fails the render instead of rotating or silently replacing
# credentials. stringData is deliberately unused so the stored encoded
# bytes are the single source of truth, and no value in the chart ever
# carries a credential. Retention agrees with the Core DB PVC: the
# helm.sh/resource-policy: keep annotation is rendered exactly when
# coreDatabase.persistence.retain is true, so a retained database and its
# credentials reinstall together, and retain=false permits both to be
# deleted together.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cbse.name.coreDatabaseCredentials" . }}
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
  {{- if .Values.coreDatabase.persistence.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "cbse.name.coreDatabaseCredentials" .) }}
{{- if $existing }}
{{- if or (not $existing.data) (not (hasKey $existing.data "SCENARIO_MANAGER_CORE_DB_USER")) }}
{{- fail "existing core-db-credentials Secret is missing the SCENARIO_MANAGER_CORE_DB_USER key; Helm will not rotate or silently replace the Core DB credentials, so repair the Secret and re-run" }}
{{- end }}
{{- if not (hasKey $existing.data "SCENARIO_MANAGER_CORE_DB_PASSWORD") }}
{{- fail "existing core-db-credentials Secret is missing the SCENARIO_MANAGER_CORE_DB_PASSWORD key; Helm will not rotate or silently replace the Core DB credentials, so repair the Secret and re-run" }}
{{- end }}
  SCENARIO_MANAGER_CORE_DB_USER: {{ index $existing.data "SCENARIO_MANAGER_CORE_DB_USER" }}
  SCENARIO_MANAGER_CORE_DB_PASSWORD: {{ index $existing.data "SCENARIO_MANAGER_CORE_DB_PASSWORD" }}
{{- else }}
  SCENARIO_MANAGER_CORE_DB_USER: {{ b64enc "cbse" }}
  SCENARIO_MANAGER_CORE_DB_PASSWORD: {{ randAlphaNum 48 | b64enc }}
{{- end }}
