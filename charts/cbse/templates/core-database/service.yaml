# Fixed client Service for the internal PostgreSQL Core DB. The name
# core-db is a code-level contract: the Scenario Manager DSN is built
# against postgres://core-db:5432, so arbitrary Helm release names must
# not alter this DNS name (D4 ruling).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cbse.name.coreDatabaseService" . }}
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "cbse.name.coreDatabaseService" . }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
