# Headless governing Service for the core-db StatefulSet. clusterIP None
# gives the single replica its stable per-Pod DNS name;
# publishNotReadyAddresses is not enabled, so clients only resolve ready
# addresses.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cbse.name.coreDatabaseService" . }}-headless
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app: {{ include "cbse.name.coreDatabaseService" . }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
