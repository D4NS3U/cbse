# Pre-delete experiment guard hook. While the Scenario Manager is still
# alive, performs a read-only list of SimulationExperiment resources in the
# release namespace. Zero objects: the uninstall proceeds. One or more: the
# Job exits non-zero, blocks the uninstall with the exact recovery guidance
# (delete all SimulationExperiments with --wait, then rerun helm uninstall),
# and leaves the Scenario Manager, Operator, NATS, and Core DB running. The
# guard never deletes, patches, or otherwise touches experiments,
# finalizers, controller resources, PVCs, Secrets, or the CRD; experiment
# names are suppressed (only a count is printed). The Job image is the
# locked public kubectl+shell image; the hook ServiceAccount carries no
# imagePullSecrets. backoffLimit 0 and restartPolicy Never: a failed guard
# Job stays in place for diagnosis until the next Helm attempt replaces it.
apiVersion: batch/v1
kind: Job
metadata:
  name: cbse-hook-experiment-guard
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: "pre-delete"
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: "before-hook-creation,hook-succeeded"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: cbse-hook-experiment-guard
        {{- include "cbse.labels" . | nindent 8 }}
    spec:
      serviceAccountName: cbse-helm-hooks
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: guard
          image: {{ include "cbse.image" .Values.hooks.kubectlImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              ns="${CBSE_HOOK_NAMESPACE}"
              items="$(kubectl get simulationexperiments.experiment.cbse.terministic.de -n "${ns}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)" || {
                echo "CBSE pre-delete guard failed: unable to list SimulationExperiments in namespace ${ns}; verify cluster access and rerun helm uninstall" >&2
                exit 1
              }
              if [ -n "${items}" ]; then
                count=0
                for _ in ${items}; do
                  count=$((count + 1))
                done
                echo "CBSE pre-delete guard: ${count} SimulationExperiment resource(s) still exist in namespace ${ns}; the uninstall is blocked until they are deleted." >&2
                echo "Recovery: delete all SimulationExperiments in namespace ${ns} with kubectl delete simulationexperiments --all -n ${ns} --wait, wait for their finalizers to clear, then rerun helm uninstall" >&2
                exit 1
              fi
              echo "CBSE pre-delete guard passed: no SimulationExperiment resources remain in namespace ${ns}"
          env:
            - name: CBSE_HOOK_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
