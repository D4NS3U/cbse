# ServiceAccount for the Helm lifecycle hooks (registry validation and the
# pre-delete experiment guard). It deliberately carries no imagePullSecrets:
# the hook Jobs must be scheduled and pulled even when the installation-owner
# Secret cbse-registry-auth is absent, so the locked hook image is a public
# source that needs no pull credential in v0.1. The hook RBAC pair is a
# pre-install/pre-upgrade/pre-delete hook with weight -10 so it exists before
# the hook Jobs (weight 0); failed hook Jobs remain for diagnosis until the
# next attempt (before-hook-creation) and successful hook resources are
# removed (hook-succeeded).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cbse-helm-hooks
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: "pre-install,pre-upgrade,pre-delete"
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: "before-hook-creation,hook-succeeded"
