# Scenario Manager ServiceAccount. It carries the fixed registry pull Secret
# reference so the scenario-manager Pod pulls its digest-pinned private image
# with cbse-registry-auth. The Secret is owned exclusively by the installation
# owner; the chart references it but never creates, mutates, or deletes it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cbse.name.scenarioManager" . }}
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
imagePullSecrets:
  {{- include "cbse.serviceAccountImagePullSecrets" . | nindent 2 }}
