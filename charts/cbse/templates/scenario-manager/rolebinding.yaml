# Namespaced RoleBinding binding the scenario-manager Role to its
# ServiceAccount in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cbse.name.scenarioManager" . }}
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cbse.name.scenarioManager" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cbse.name.scenarioManager" . }}
    namespace: {{ .Release.Namespace }}
