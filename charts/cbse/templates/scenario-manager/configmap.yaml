# Scenario Manager configuration (non-secret). The Core DB DSN is non-secret
# configuration: it names the fixed internal core-db Service and the Core DB
# database name, carries no credentials, and uses sslmode=disable on the
# namespace-local ClusterIP network. The credentials are injected separately
# from the Helm-managed core-db-credentials Secret (H3 contract). The NATS
# contract is authentication-free: the legacy user/password entries are
# explicitly empty because the SM and the alpha4 clients reject
# credential-bearing configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-manager-config
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
data:
  SCENARIO_MANAGER_CORE_DB_DSN: postgres://{{ include "cbse.name.coreDatabaseService" . }}:5432/{{ .Values.coreDatabase.database }}?sslmode=disable
  SCENARIO_MANAGER_CORE_DB_SCENARIO_STATUS_TABLE: scenario_status
  SCENARIO_MANAGER_CORE_DB_PROJECT_TABLE: project
  SCENARIO_MANAGER_NATS_URL: nats://{{ include "cbse.name.natsService" . }}:4222
  SCENARIO_MANAGER_NATS_USER: ""
  SCENARIO_MANAGER_NATS_PASSWORD: ""
  SCENARIO_MANAGER_RUNNER_START_WORKERS: "{{ .Values.scenarioManager.runnerStartWorkers }}"
  SCENARIO_MANAGER_HEALTH_ADDRESS: ":{{ .Values.scenarioManager.healthPort }}"
