# One-replica NATS server StatefulSet with JetStream enabled. Stable
# selector and serviceName, digest-pinned image via cbse.image, and the
# authentication-free nats-config mounted read-only (D9 ruling: no
# credential Secret in v0.1). The image is an official external image:
# the Pod carries no pull Secret, matching the Secret inventory (the fixed
# cbse-registry-auth is referenced by the installation-owner Service
# Accounts only); pointing the image at a private mirror is a future
# installation-owner concern. Persistent mode (default) mounts the
# JetStream store from the retained `data` claim template and keeps the
# claim on delete and scale via persistentVolumeClaimRetentionPolicy; the
# explicit development branch (persistence.enabled=false) swaps in an
# emptyDir volume at the same mount path and renders no claim template.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cbse.name.natsService" . }}
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cbse.name.natsService" . }}
  serviceName: {{ include "cbse.name.natsService" . }}-headless
  {{- if .Values.nats.persistence.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ if .Values.nats.persistence.retain }}Retain{{ else }}Delete{{ end }}
    whenScaled: {{ if .Values.nats.persistence.retain }}Retain{{ else }}Delete{{ end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.nats.persistence.size }}
        {{- if .Values.nats.persistence.storageClass }}
        storageClassName: {{ .Values.nats.persistence.storageClass }}
        {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ include "cbse.name.natsService" . }}
        {{- include "cbse.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: {{ include "cbse.image" .Values.nats.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["-c", "/etc/nats-config/nats-server.conf"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/nats-config
              readOnly: true
            - name: data
              mountPath: /data/jetstream
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: nats-config
        {{- if not .Values.nats.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
