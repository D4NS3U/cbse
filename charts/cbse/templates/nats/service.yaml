# Fixed client Service for the internal NATS/JetStream server. The name
# sm-eds-nats is a code-level contract: the operator injects
# nats://sm-eds-nats:4222 into experiment components and the Scenario
# Manager connects to it, so arbitrary Helm release names must not alter
# this DNS name (D4 ruling). The monitor port is published for the
# JetStream health endpoint used by the NATS probes.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cbse.name.natsService" . }}
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "cbse.name.natsService" . }}
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
