# Experiment Operator ServiceAccount. It carries the fixed registry pull
# Secret reference so the operator Pod pulls its digest-pinned private image
# with cbse-registry-auth. The Secret is owned exclusively by the installation
# owner; the chart references it but never creates, mutates, or deletes it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cbse.name.experimentOperator" . }}
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
imagePullSecrets:
  {{- include "cbse.serviceAccountImagePullSecrets" . | nindent 2 }}
