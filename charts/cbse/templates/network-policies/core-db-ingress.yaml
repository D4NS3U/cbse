# Ingress-only NetworkPolicy for the internal Core DB, rendered when
# networkPolicies.enabled (default). TCP 5432 is allowed only from the
# Scenario Manager Pods. No egress policy, no namespaceSelector, no
# cross-namespace peer, and no cluster CIDR in v0.1.
{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-db-ingress
  labels:
    {{- include "cbse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "cbse.name.coreDatabaseService" . }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: scenario-manager
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
