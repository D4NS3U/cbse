apiVersion: experiment.cbse.terministic.de/alpha4
kind: SimulationExperiment
metadata:
  name: CBSE_PROJECT
  namespace: CBSE_NAMESPACE
  labels:
    cbse.terministic.de/test-run: CBSE_RUN_ID
spec:
  defaultServiceType: ClusterIP
  detailDatabase:
    image: CBSE_DETAIL_DB_IMAGE
    dbname: simulation_db
    user: smoke
    password: smoke
    port: 5432
    serviceType: ClusterIP
  resultDatabase:
    image: CBSE_POSTGRES_IMAGE
    dbname: result_db
    user: smoke
    password: smoke
    port: 5432
    serviceType: ClusterIP
  translator:
    image: CBSE_TRANS_IMAGE
    repository: CBSE_RUNNER_REPOSITORY
    baseimage: CBSE_RUNNER_BASE_IMAGE
    builderImage: CBSE_BUILDER_IMAGE
    registryAuthSecretRef:
      name: cbse-registry-auth
    port: 8080
    serviceType: ClusterIP
  postProcessingService:
    image: CBSE_SUPPORT_IMAGE
    port: 8081
    serviceType: ClusterIP
  experimentalDesignService:
    design: "two deterministic batches with two scenarios each"
    image: CBSE_SUPPORT_IMAGE
    port: 8082
    serviceType: ClusterIP
